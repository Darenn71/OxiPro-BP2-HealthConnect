name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk oxipro-bridge.apk

      - uses: actions/upload-artifact@v4
        with:
          name: oxipro-bridge-debug-apk
          path: oxipro-bridge.apk
          retention-days: 30

      # Every push to main becomes a release, so the README's
      # releases/latest/download link always points at the newest APK.
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: Debug APK built from ${{ github.sha }}.
          files: oxipro-bridge.apk
          make_latest: true
